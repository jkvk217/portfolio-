name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The built site is pushed to the gh-pages branch, which Pages serves in
# "Deploy from a branch" mode. This avoids the Actions-source setting.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          GITHUB_PAGES: '1'
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
